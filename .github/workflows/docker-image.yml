---
name: Build & Push bridgepay-refund Image (ECR)

# Branch flow: work branch -> staging -> deploy -> main.
# staging: verify only (build + tests), nothing is published or deployed.
# deploy:  publish the image and update the GitOps repo; only commits that
#          were already on staging are accepted.
on:
  push:
    branches: ["staging", "deploy"]
  pull_request:
    branches: ["staging"]

permissions:
  id-token: write
  contents: read

jobs:
  verify:
    if: github.ref != 'refs/heads/deploy'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx nest build

      - name: Test
        run: npm test

  build-and-push:
    if: github.ref == 'refs/heads/deploy'
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ap-southeast-3
      ECR_REGISTRY: 307581778632.dkr.ecr.ap-southeast-3.amazonaws.com
      ECR_REPOSITORY: bridgepay/refund

    steps:
      - name: Checkout repository (with tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch tags (ensure tag discovery works)
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags

      - name: Require that this commit was tested on staging
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin staging
          if ! git merge-base --is-ancestor HEAD origin/staging; then
            echo "ERROR: this commit is not on the staging branch."
            echo "Merge the work to staging and test it there, then fast-forward deploy to it."
            exit 1
          fi

      - name: Determine release tag for this commit
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          # Find a v* tag that points exactly at HEAD. This enforces your manual release tagging discipline.
          TAG=$(git tag --points-at HEAD | grep -E '^v[0-9]+' | head -n 1 || true)

          if [ -z "$TAG" ]; then
            echo "ERROR: No release tag (v*) points at this commit (HEAD)."
            echo "Create and push a tag (e.g., v2.7.14) on the intended commit, then fast-forward the deploy branch to that tag."
            exit 1
          fi

          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${TAG}"

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

          echo "Release tag: ${TAG}"
          echo "Image URI: ${IMAGE_URI}"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push image to ECR
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image_uri }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Show pushed image digest
        shell: bash
        run: |
          set -euo pipefail
          echo "Pushed digest: ${{ steps.build.outputs.digest }}"

      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: usdlkj/bridgepay-deploy
          ref: deploy
          path: gitops
          ssh-key: ${{ secrets.GITOPS_DEPLOY_KEY }}

      - name: Update image tag in GitOps repo
        shell: bash
        run: |
          set -euo pipefail
          cd gitops
          sed -i "s|image: .*bridgepay/refund.*|image: ${{ steps.meta.outputs.image_uri }}|g" \
            envs/current/refund/deployment.yaml
          git config user.email "ci@kcic.co.id"
          git config user.name "KCIC CI"
          git add envs/current/refund/deployment.yaml
          git diff --staged --quiet || git commit -m "ci: update bridgepay-refund to ${{ steps.meta.outputs.tag }}"
          git push origin deploy
